                window.location.href = 'chemicals.html';
                return;
            }
            try {
                // Pass both chemical query parameters so chemicals.html handles filtering and opening card automatically
                const query = encodeURIComponent(chemicalName.trim());
                window.location.href = `chemicals.html?search=${query}&chemical=${query}`;

                console.warn('Navigation failed, falling back to chemicals page:', err);
                window.location.href = 'chemicals.html';

        function initTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';
            
            slideData.forEach((slide, idx) => {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-xl text-xs font-semibold transition-all whitespace-nowrap flex items-center gap-2 border ${
                    idx === currentSlideIndex 
                        ? 'bg-cyan-500/20 text-cyan-300 border-cyan-400/50 shadow-md shadow-cyan-500/10' 
                        : 'bg-slate-900/50 text-slate-400 border-slate-800 hover:text-slate-200'
                }`;
                btn.onclick = () => goToSlide(idx);
                btn.innerHTML = `<i class="fa-solid ${slide.icon}"></i> ${slide.category}`;
                tabsContainer.appendChild(btn);
            });
        }

        function renderSlide() {
            const current = slideData[currentSlideIndex];
            document.getElementById('slideContent').innerHTML = current.render();
            document.getElementById('currentSlideNum').innerText = currentSlideIndex + 1;
            document.getElementById('totalSlideNum').innerText = slideData.length;
            
            const progress = ((currentSlideIndex + 1) / slideData.length) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;

            document.getElementById('prevBtn').disabled = currentSlideIndex === 0;
            document.getElementById('nextBtn').disabled = currentSlideIndex === slideData.length - 1;

            document.getElementById('prevBtn').style.opacity = currentSlideIndex === 0 ? '0.5' : '1';
            document.getElementById('nextBtn').style.opacity = currentSlideIndex === slideData.length - 1 ? '0.5' : '1';

            initTabs();
        }

        function nextSlide() {
            if (currentSlideIndex < slideData.length - 1) {
                currentSlideIndex++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlide();
            }
        }

        function goToSlide(index) {
            currentSlideIndex = index;
            renderSlide();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Keyboard arrow navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        // Initialize presentation on load
        window.onload = function() {
            renderSlide();
        };
    </script>
